<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes · Organizer</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../base.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../tw.js"></script>
<script src="../theme.js"></script>
<script src="../icons.js" defer></script>
<script src="../chrome.js" defer></script>
</head>

<!--
  CALENDARIO · MES                   (FD3 · decisiones 53, 67) · REHECHO
  ---------------------------------------------------------------------------
  Pregunta que contesta:  ¿QUÉ SE ME VIENE ENCIMA?

  Solo reminders. Ni tareas ni materias (decisión 53, confirmada en FD3).
  Es exactamente lo que el usuario hacía en el Calendar del iPhone: abrir el
  mes para ver cuándo son los parciales.

  Referencia 12: rejilla con puntos. Nada escrito dentro de la celda.

  POR QUÉ NO SE ESCRIBE NADA EN LA CELDA
  Una celda de 50px sólo cabe un título mutilado, y un título mutilado se lee
  peor que un punto: obliga a descifrar en vez de contar. El punto contesta
  la única pregunta de este nivel —¿hay algo ese día?— en una fijación de
  ojo. Y como el punto es ÁMBAR, contesta también "¿de qué tipo?" sin gastar
  una palabra. El nombre completo está a un toque, en Día.

  DOS REMINDERS EL MISMO DÍA → DOS PUNTOS. Esto cierra el hueco que quedó
  abierto en FD2 §4.5.2, donde una celda con un bloque escrito sólo podía
  mostrar el primero. Con puntos, tres caben.

  LA REJILLA OCUPA LA PANTALLA ENTERA. No es un widget arrinconado arriba:
  es la vista. Las filas se reparten el alto disponible, así que un mes de
  cinco semanas y uno de seis se ven igual de tranquilos.

  Y LO QUE NO ESTÁ AQUÍ: "Lo que viene" se fue al módulo Tareas (decisión
  73). El calendario contesta CUÁNDO; la lista contesta QUÉ SIGUE. Tenerlo en
  los dos sitios duplicaba la misma información con dos formas distintas.
-->

<style>
  .stack { width: 390px; }
  .caption { padding: var(--space-6) var(--gutter) var(--space-3); }
  .caption h2 { font-size: var(--text-meta); font-weight: var(--weight-semibold); }
  .caption p { font-size: var(--text-label); color: var(--text-muted); margin-top: 2px; }
  .topfixed { box-shadow: inset 0 -1px 0 var(--line); background: var(--bg); }

  /* La rejilla ocupa lo que queda. Solo se estira #grid: la fila de las
     iniciales de los días es cabecera y mantiene su alto natural. */
  .monthwrap { display: flex; flex-direction: column; height: 100%; padding-bottom: var(--space-4); }
  .monthwrap #grid { flex: 1 1 auto; grid-auto-rows: minmax(0, 1fr); }
  .monthwrap .mday { min-height: 0; justify-content: center; gap: var(--space-2); padding-block: 0; }
  .mday__n { width: 34px; height: 34px; font-size: var(--text-body); }
</style>

<body class="comp" style="flex-direction:column;align-items:center">
<div class="stack">

  <div class="caption">
    <h2>Mes · septiembre de 2026</h2>
    <p>Solo reminders, en puntos ámbar. Un día sin punto es un día limpio.</p>
  </div>

  <div class="device">
    <div data-statusbar="15:45"></div>

    <div class="topfixed">
      <!-- MISMA CABECERA, sin chevron: Mes es el techo de la escalera. El
           título ocupa el sitio exacto del botón de subir, así que al cambiar
           de nivel la cabecera no se mueve ni un píxel. -->
      <div class="calhead">
        <h1 class="calhead__title">Septiembre</h1>
        <div class="calhead__acts">
          <button class="taptext taptext--quiet t-meta" style="margin-inline:0">Hoy</button>
          <button class="tapicon" aria-label="Mes anterior"><span class="ico ico--lg" data-icon="chevron-left"></span></button>
          <button class="tapicon" aria-label="Mes siguiente"><span class="ico ico--lg" data-icon="chevron-right"></span></button>
          <a href="anadir.html" class="tapicon no-underline" aria-label="Añadir" style="color:var(--task)">
            <span class="ico ico--lg" data-icon="plus"></span>
          </a>
        </div>
      </div>

      <p class="callabel">2026<span class="sep"> · </span>7 reminders este mes</p>
    </div>

    <main class="screen screen--fixed">
      <div class="monthwrap">
        <div class="month" style="grid-auto-rows:auto">
          <div class="month__dow">L</div><div class="month__dow">M</div><div class="month__dow">X</div>
          <div class="month__dow">J</div><div class="month__dow">V</div><div class="month__dow">S</div>
          <div class="month__dow">D</div>
        </div>
        <div class="month" id="grid"></div>
      </div>
    </main>

    <a href="anadir.html" class="fab no-underline" aria-label="Añadir un reminder">
      <span class="ico ico--lg" data-icon="plus"></span>
    </a>

    <nav data-tabbar="semana"></nav>
    <div data-homebar></div>
  </div>

  <div style="height:var(--space-10)"></div>
</div>

<script>
  /* Septiembre de 2026 empieza en martes, así que la rejilla arranca el
     lunes 31 de agosto y son cinco filas. Hoy es jueves 17.
     Cada entrada es el número de reminders de ese día. */
  var REMINDERS = { 15: 1, 17: 1, 18: 1, 23: 2, 28: 1, 30: 1 };
  var TODAY = 17, DAYS = 30, LEAD = 1, PREV = 31;   /* agosto tiene 31 */

  var cells = [], i;
  for (i = 0; i < LEAD; i++) cells.push({ n: PREV - LEAD + 1 + i, out: true });
  for (i = 1; i <= DAYS; i++) cells.push({ n: i, out: false });
  while (cells.length % 7) cells.push({ n: cells.length - LEAD - DAYS + 1, out: true });

  document.getElementById('grid').innerHTML = cells.map(function (c) {
    var count = c.out ? 0 : (REMINDERS[c.n] || 0);
    var past  = !c.out && c.n < TODAY;
    var cls = 'mday' + (c.out ? ' mday--out' : '') + (past ? ' mday--past' : '') +
              (!c.out && c.n === TODAY ? ' mday--today' : '');
    /* La banda de puntos se dibuja SIEMPRE, tenga o no reminders. Si solo
       apareciera cuando hay algo, los numeros de una misma fila quedarian a
       alturas distintas y la rejilla dejaria de leerse como rejilla. */
    var dots = '<span class="mday__dots" aria-hidden="true">' +
               new Array(count + 1).join('<i></i>') + '</span>';
    /* Tocar un día baja a Día. El aria-label dice lo que el punto dice en
       color, porque un punto no se lee con lector de pantalla. */
    var label = c.n + (count ? ' de septiembre, ' + count + (count === 1 ? ' reminder' : ' reminders') : ' de septiembre, sin reminders');
    return '<a href="dia.html" class="' + cls + ' no-underline" aria-label="' + label + '"' +
           (!c.out && c.n === TODAY ? ' aria-current="date"' : '') + '>' +
           '<span class="mday__n num">' + c.n + '</span>' + dots + '</a>';
  }).join('');

  if (window.renderIcons) window.renderIcons();
</script>
</body>
</html>
